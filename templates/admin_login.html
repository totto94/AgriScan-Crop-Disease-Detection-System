{% extends "base.html" %}

{% block title %}Admin Login - AgriScan{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">🔐 Admin Login</h3>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login as Admin</button>
                </form>

                <p class="text-center mt-3 text-muted small">
                    Default Admin: admin@agriscan.com / admin123
                </p>
                <p class="text-center">
                    <a href="{{ url_for('login') }}" class="text-success">← Back to Farmer Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
