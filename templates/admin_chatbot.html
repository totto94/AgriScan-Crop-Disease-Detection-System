{% extends "base.html" %}

{% block title %}Admin Chatbot - AgriScan{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2>🤖 AI Farming Assistant (Admin)</h2>
        <p class="text-muted">Help farmers with crop disease questions</p>
    </div>
</div>

<div class="card shadow">
    <div class="card-body">
        <div id="chatMessages" style="height: 400px; overflow-y: auto; border-bottom: 1px solid #ddd; padding: 16px;">
            <div class="text-center text-muted mb-3">
                <i class="bi bi-robot" style="font-size: 48px;"></i>
                <p>Hello! I'm your AI farming assistant. Ask about crop diseases!</p>
            </div>
        </div>
        
        <div class="input-group mt-3">
            <input type="text" id="chatInput" class="form-control" placeholder="Ask about crop diseases...">
            <button id="sendBtn" class="btn btn-success">
                <i class="bi bi-send"></i> Send
            </button>
        </div>
    </div>
</div>

<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, isUser = false) {
    const div = document.createElement('div');
    div.className = `d-flex ${isUser ? 'justify-content-end' : 'justify-content-start'} mb-2`;
    div.innerHTML = `
        <div class="p-3 rounded ${isUser ? 'bg-primary text-white' : 'bg-light'} shadow-sm" style="max-width: 70%;">
            ${text.replace(/\n/g, '<br>')}
        </div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
    const message = chatInput.value.trim();
    if (!message) return;

    addMessage(message, true);
    chatInput.value = '';

    const typingDiv = document.createElement('div');
    typingDiv.className = 'text-start mb-2';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `<div class="p-3 rounded bg-light shadow-sm">🤖 Typing...</div>`;
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('typingIndicator').remove();
        addMessage(data.response, false);
    });
}
</script>
{% endblock %}
